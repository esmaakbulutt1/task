name: TaskFlow CD

on:
  workflow_run:
    workflows:
      - TaskFlow CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io

jobs:
  publish-images:
    name: Docker image'larını yayınla
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: CI tarafından test edilen kodu al
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}  
      - name: Docker Buildx hazırla
        uses: docker/setup-buildx-action@v4

      - name: GitHub Container Registry'ye giriş yap
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}          
      - name: API Docker image oluştur ve yayınla
        uses: docker/build-push-action@v7
        with:
          context: ./api
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/taskflow-api:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/taskflow-api:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web Docker image oluştur ve yayınla
        uses: docker/build-push-action@v7
        with:
          context: ./web
          target: production
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/taskflow-web:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/taskflow-web:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web          
